AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CDK Pipeline の前提リソース（S3 / IAM）。
  CDK の管理外とするため、CloudFormation で個別に作成する。

Parameters:
  Prefix:
    Type: String
    Default: multi-input
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,20}$"
    Description: リソース名の接頭辞（小文字英数字とハイフン、21 文字以内）
  PipelineName:
    Type: String
    Default: multi-input-pipeline
    Description: CDK で作成する CodePipeline のパイプライン名
  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: cdk bootstrap の Qualifier（既定値のままなら変更不要）

Resources:
  # ------------------------------------------------------------
  # S3
  # ------------------------------------------------------------

  # アプリ用ソース配置（zip）
  AppSourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-app-source-${AWS::AccountId}-${AWS::Region}"
      # CodePipeline の S3 ソースはバージョニングが必須
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # オブジェクト配置をパイプライン起動のトリガーにするため EventBridge へ通知
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # CDK・Pipeline 用ソース配置（zip）
  CdkSourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-cdk-source-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # パイプラインのアーティファクト置き場
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-artifact-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # ------------------------------------------------------------
  # IAM
  # ------------------------------------------------------------

  # CodePipeline のサービスロール
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ソースバケットの読み取り
              - Sid: ReadSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt AppSourceBucket.Arn
                  - !Sub "${AppSourceBucket.Arn}/*"
                  - !GetAtt CdkSourceBucket.Arn
                  - !Sub "${CdkSourceBucket.Arn}/*"
              # アーティファクトの読み書き
              - Sid: ReadWriteArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              # Synth / SelfMutate / Assets の CodeBuild 実行
              - Sid: RunCodeBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:StopBuild
                Resource: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/*"
              # CloudFormation デプロイ時に bootstrap のデプロイロールを引き受ける
              - Sid: AssumeCdkDeployRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}"

  # CodeBuild（Synth / SelfMutate / Assets）のサービスロール
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Sid: ReadWriteArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ReportGroups
                Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*"
              # cdk deploy / アセット公開のために bootstrap ロールを引き受ける
              - Sid: AssumeCdkBootstrapRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-*-${AWS::AccountId}-${AWS::Region}"

  # S3 へのオブジェクト配置で EventBridge からパイプラインを起動するロール
  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-events-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${PipelineName}"

Outputs:
  AppSourceBucketName:
    Value: !Ref AppSourceBucket
    Export:
      Name: !Sub "${Prefix}-AppSourceBucketName"
  CdkSourceBucketName:
    Value: !Ref CdkSourceBucket
    Export:
      Name: !Sub "${Prefix}-CdkSourceBucketName"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub "${Prefix}-ArtifactBucketName"
  PipelineRoleArn:
    Value: !GetAtt PipelineRole.Arn
    Export:
      Name: !Sub "${Prefix}-PipelineRoleArn"
  CodeBuildRoleArn:
    Value: !GetAtt CodeBuildRole.Arn
    Export:
      Name: !Sub "${Prefix}-CodeBuildRoleArn"
  EventsRoleArn:
    Value: !GetAtt EventsRole.Arn
    Export:
      Name: !Sub "${Prefix}-EventsRoleArn"
